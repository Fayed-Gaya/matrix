name: Matrix smoke
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'archive/**'
      - 'assets/art/source/**'
      - 'levels/*/source/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'archive/**'
      - 'assets/art/source/**'
      - 'levels/*/source/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: Integration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        id: editor
        with:
          path: build/toolchain/godot/godot
          key: godot-editor-${{ runner.os }}-${{ hashFiles('scripts/release/godot-toolchain.json', 'scripts/setup_godot.py') }}
      - name: Install verified Godot editor (no export templates)
        if: steps.editor.outputs.cache-hit != 'true'
        run: python3 scripts/setup_godot.py --editor
      - name: Import and smoke registered routes
        run: make smoke-check GODOT="$PWD/build/toolchain/godot/godot"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure-logs
          path: build/test-logs/
