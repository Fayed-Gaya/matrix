[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="levels/*/assets/*.json,THIRD_PARTY_NOTICES.md,LICENSES/*.txt"
exclude_filter="assets/README.md,archive/*,assets/art/source/*,assets/audio/redgifs-wittysizzlingmongoose.mp3,legacy/*,docs/*,scripts/*,tests/*,.github/*,build/*,exports/*,levels/*/source/*,README.md,AGENTS.md,assets/*/README.md,assets/art/*/README.md,assets/audio/*/README.md,levels/*/README.md,shared/README.md"
export_path="exports/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug="res://build/toolchain/godot/web_nothreads_debug.zip"
custom_template/release="res://build/toolchain/godot/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<link rel=\"icon\" href=\"index.png\"><link rel=\"license\" href=\"THIRD_PARTY_NOTICES.md\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
